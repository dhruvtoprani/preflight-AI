[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "preflight-slack-bot"
version = "0.1.0"
description = "Slack app for PreFlight"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "slack-bolt>=1.21.0",
  "slack-sdk>=3.31.0",
  "httpx>=0.27.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
